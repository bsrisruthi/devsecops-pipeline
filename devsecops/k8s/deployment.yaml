apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-app
  labels:
    app: health-app
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-app
  template:
    metadata:
      labels:
        app: health-app
        env: dev
      annotations:
        deployment.timestamp: "2026-10-22-v5-monitoring"
    spec:
      containers:
      - name: health-app
        image: ghcr.io/bsrisruthi/health-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        env:  #VAULT SECTION
        - name: VAULT_ADDR
          value: "http://host.docker.internal:8200"
        - name: VAULT_TOKEN
          value: "myroot"

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

