apiVersion: v1
kind: Service
metadata:
  name: health-app-metrics
  namespace: health-app
  labels:
    app: health-app
spec:
  selector:
    app: health-app
  ports:
  - name: metrics
    port: 5000
    targetPort: 5000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-app-monitor
  namespace: health-app
  labels:
    app: health-app
    release: prometheus
spec:
  selector:
    matchLabels:
      app: health-app
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s

