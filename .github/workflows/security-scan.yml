name: DevSecOps Security Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

#TruffleHog for Secret Scanning
jobs:
    secret-scan:
        name: Scan for Secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run TruffleHog
              run: |
                docker run --rm -v "$PWD:/scan" ghcr.io/trufflesecurity/trufflehog:latest filesystem /scan/devsecops --fail --json

#only verified key lets trufflehog check if the keys are real
#fail means exit with error code if any secrets are found

#Trivy Scanning
    container-scan:
        name: Scan Docker Image for Vulnerabilities
        runs-on: ubuntu-latest
        needs: secret-scan
#means it only runs after secret-scan job is completed
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              
            - name: Build Docker Image
              run: |
                docker build -t health-app:test ./devsecops/health-app
            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: 'health-app:test'
                format: 'table'
                exit-code: '1'
                severity: 'CRITICAL'
            
#exit-code=1 | fails the build if CVEs are found
#severity- only fail CRITICAL|HIGH Vulnerabilities
#changing code to only CRITICAL, since we noticed 44 HIGH CVEs in latest scan

#Checkov Scanning
    iac-scan:
        name: Scan Infrastructure as Code
        runs-on: ubuntu-latest
        needs: container-scan
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Run Checkov IaC Scan
              uses: bridgecrewio/checkov-action@master
              with:
                directory: devsecops/terraform
                framework: terraform
                soft_fail: false
                output_format: cli
                #skip_check: CKV2_AWS_61,CKV_AWS_21,CKV_AWS_145,CKV_AWS_18,CKV_AWS_144,CKV_AWS_62
                check: CKV2_AWS_6,CKV_AWS_93

#since checkov supports multiple iac tools(tf,k8s,cloudformation,dockerfile)
#we specify framework
#fail the build if issues are found- always use false in prod, because the build should fail if any issues are found
#output can be cli or json, prints in github actions             
#added skip check as checkov was listing so many issues, skipping it just for learning

#skip check is not working, so adding check to check only critical ones



    notify:
        name: Send Notification
        runs-on: ubuntu-latest
        needs: [secret-scan, container-scan, iac-scan]
        if: always()  # Run even if previous jobs fail
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install Dependencies
              run: |
                pip install -r devsecops/scripts/requirements.txt

            - name: Send Notification
              env:
                DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                SECRET_SCAN_STATUS: ${{ needs.secret-scan.result }}
                CONTAINER_SCAN_STATUS: ${{ needs.container-scan.result }}
                IAC_SCAN_STATUS: ${{ needs.iac-scan.result }}
                GITHUB_REPOSITORY: ${{ github.repository }}
                GITHUB_RUN_ID: ${{ github.run_id }}
                GITHUB_ACTOR: ${{ github.actor }}
                GITHUB_REF: ${{ github.ref }}
              run: |
                pyton devsecops/scripts/notify.py




