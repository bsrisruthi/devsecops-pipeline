name: DevSecOps Security Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

#TruffleHog for Secret Scanning
jobs:
    secret-scan:
        name: Scan for Secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run TruffleHog
              run: |
                docker run --rm -v "$PWD:/scan" ghcr.io/trufflesecurity/trufflehog:latest filesystem /scan/devsecops --fail --json

#only verified key lets trufflehog check if the keys are real
#fail means exit with error code if any secrets are found

#Trivy Scanning
    container-scan:
        name: Scan Docker Image for Vulnerabilities
        runs-on: ubuntu-latest
        needs: secret-scan
#means it only runs after secret-scan job is completed
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              
            - name: Build Docker Image
              run: |
                docker build -t health-app:test ./devsecops/health-app
            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: 'health-app:test'
                format: 'table'
                exit-code: '1'
                severity: 'CRITICAL,HIGH'
#exit-code=1 | fails the build if CVEs are found
#severity- only fail CRITICAL|HIGH Vulnerabilities



