name: DevSecOps Security Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

#TruffleHog for Secret Scanning
jobs:
    secret-scan:
        name: Scan for Secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              with:
                path: ./
                base: ${{ github.event.repository.default_branch }}
                head: HEAD

#only verified key lets trufflehog check if the keys are real
#fail means exit with error code if any secrets are found


